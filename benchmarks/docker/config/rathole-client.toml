[client]
remote_addr = "rathole-server:2333"
default_token = "docker-benchmark-only-token"
heartbeat_timeout = 20
retry_interval = 1

[client.transport]
type = "noise"

[client.transport.tcp]
nodelay = true

[client.transport.noise]
pattern = "Noise_NK_25519_ChaChaPoly_BLAKE2s"
remote_public_key = "U3nP7JLvTBWEaXdGLMQW78dBG3iDTFCIfIoN8fLzBSI="

[client.services.http]
type = "tcp"
local_addr = "backend:3000"
nodelay = true

[client.services.tcp_echo]
type = "tcp"
local_addr = "backend:3001"
nodelay = true

[client.services.udp_echo]
type = "udp"
local_addr = "backend:3002"

[client.services.https]
type = "tcp"
local_addr = "backend:3443"
nodelay = true
