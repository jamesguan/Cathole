serverAddr = "frp-server"
serverPort = 7000
auth.method = "token"
auth.token = "docker-benchmark-only-token"
loginFailExit = false
transport.protocol = "tcp"
transport.wireProtocol = "v2"
transport.tcpMux = true
transport.poolCount = 16
transport.tls.enable = true
log.to = "console"
log.level = "warn"

[[proxies]]
name = "http-benchmark"
type = "tcp"
localIP = "backend"
localPort = 3000
remotePort = 8080
transport.useEncryption = true
transport.useCompression = false

[[proxies]]
name = "tcp-echo-benchmark"
type = "tcp"
localIP = "backend"
localPort = 3001
remotePort = 8081
transport.useEncryption = true
transport.useCompression = false

[[proxies]]
name = "udp-echo-benchmark"
type = "udp"
localIP = "backend"
localPort = 3002
remotePort = 8082
transport.useEncryption = true
transport.useCompression = false

[[proxies]]
name = "https-benchmark"
type = "tcp"
localIP = "backend"
localPort = 3443
remotePort = 8443
transport.useEncryption = true
transport.useCompression = false
