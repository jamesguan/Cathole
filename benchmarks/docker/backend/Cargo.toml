[package]
name = "cathole-benchmark-backend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
bytes = "1"
futures-util = "0.3"
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 1
