[package]
name = "cathole"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reverse proxy with Noise-protected payloads over QUIC/UDP"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log", "bloom"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = { version = "0.10", features = ["ring-accelerated"] }
socket2 = "0.6"
subtle = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
