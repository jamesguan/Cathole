remote_public_key = "BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBA="

[client.services.first]
local_addr = "127.0.0.1:6969"

[client.services.second]
local_addr = "127.0.0.1:2283"
